<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>امتيازات الاستقراطية | SAKI</title>
<style>
:root{--gold:#f5c85b;--bg:#08090d;--panel:#12141b;--muted:#9da3b5;--text:#fff8e6;--line:#2a2b36;--accent:#e9a945}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -12%,#493111 0,#17131a 30%,#08090d 70%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh;overflow-x:hidden}.app{max-width:680px;margin:auto;min-height:100vh;padding-bottom:108px}.top{height:60px;display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;z-index:4;background:rgba(8,9,13,.76);backdrop-filter:blur(16px);border-bottom:1px solid #ffffff10}.back{border:0;background:#ffffff12;color:#fff;width:36px;height:36px;border-radius:50%;font-size:22px}.top h1{font-size:18px;margin:0;font-weight:800}.user{margin:18px 16px 10px;padding:14px 16px;display:flex;align-items:center;gap:12px;border:1px solid #e4ae4c35;border-radius:20px;background:linear-gradient(135deg,#211b18,#12131a);box-shadow:0 16px 40px #0008}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#2b2020}.user small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.coin{margin-right:auto;color:var(--gold);font-weight:800;font-size:13px}.levels{display:flex;gap:10px;overflow:auto;padding:8px 16px 14px;scrollbar-width:none}.levels::-webkit-scrollbar{display:none}.level{flex:0 0 92px;height:64px;background:#141621;border:1px solid var(--line);color:#aeb2c1;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;cursor:pointer;transition:.18s transform,.18s border,.18s color}.level:active{transform:scale(.97)}.level.active{border-color:var(--gold);color:#fff;box-shadow:0 0 24px #e5ad3d25;background:linear-gradient(180deg,#3b2c19,#171820)}.level b{font-size:12px}.level span{font-size:24px;line-height:1}.hero{text-align:center;padding:14px 16px 20px}.crown{width:170px;height:170px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:82px;position:relative;background:radial-gradient(circle,#80652e 0,#33281a 35%,#17131a 69%,transparent 70%);filter:drop-shadow(0 0 28px #e3ab4d77);animation:pulse 2.4s ease-in-out infinite}.crown:before,.crown:after{content:"";position:absolute;inset:11px;border:1px solid #f3cb7244;border-radius:50%;animation:spin 12s linear infinite}.crown:after{inset:25px;border-style:dashed;animation-direction:reverse;animation-duration:18s}.hero h2{font-size:24px;margin:0 0 7px;background:linear-gradient(90deg,#fff,#f4c862,#fff);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:13px;margin:0}.section-title{display:flex;justify-content:space-between;align-items:center;padding:0 18px 10px}.section-title h3{margin:0;font-size:15px}.section-title span{font-size:11px;color:var(--muted)}.features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 16px}.feature{min-height:108px;padding:14px;border-radius:17px;background:linear-gradient(145deg,#171923,#101117);border:1px solid #ffffff0e;box-shadow:0 10px 25px #0004;animation:rise .35s both}.feature i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,#f5d77f33,#9c61251f);color:var(--gold);font-size:21px;margin-bottom:10px}.feature b{font-size:13px;display:block}.feature small{display:block;color:var(--muted);line-height:1.55;font-size:10px;margin-top:5px}.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(13,14,20,.93);backdrop-filter:blur(18px);border-top:1px solid #ffffff12;display:flex;align-items:center;gap:12px;z-index:6}.price{font-size:13px;color:#fff}.price strong{display:block;color:var(--gold);font-size:19px}.buy{margin-right:auto;border:0;border-radius:15px;padding:14px 24px;font-weight:800;color:#271b06;background:linear-gradient(135deg,#ffe9a5,#d99325);box-shadow:0 8px 24px #d99b2f36}.buy:disabled{opacity:.55}.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-10px);opacity:0;background:#20232e;color:#fff;border:1px solid #ffffff18;padding:11px 15px;border-radius:12px;font-size:12px;z-index:20;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.loading{opacity:.55;pointer-events:none}@keyframes pulse{50%{transform:scale(1.035);filter:drop-shadow(0 0 42px #e3ab4db0)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(min-width:560px){.features{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head>
<body><main class="app" id="app"><header class="top"><button class="back" onclick="history.back()">‹</button><h1>الاستقراطية</h1></header><section class="user"><img class="avatar" id="avatar" src="" alt=""><div><b id="username">مستخدم SAKI</b><small id="status">جاري تحميل العضوية...</small></div><div class="coin" id="balance">— ذهب</div></section><nav class="levels" id="levels"></nav><section class="hero"><div class="crown" id="crown">♛</div><h2 id="title">امتيازات الاستقراطية</h2><p id="subtitle">اختر رتبتك وفعّل حضورك داخل SAKI</p></section><div class="section-title"><h3>المميزات المتاحة</h3><span id="featureCount"></span></div><section class="features" id="features"></section></main><div class="bar"><div class="price"><span id="duration">30 يومًا</span><strong id="price">— ذهب</strong></div><button class="buy" id="buy">شراء وتفعيل</button></div><div class="toast" id="toast"></div>
<script>
const qs=new URLSearchParams(location.search), token=qs.get('access_token')||localStorage.getItem('saki_token')||'';const API=location.origin+'/api.php';let catalog=[],selected=null,status=null;
const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('ar').format(Number(n||0));
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
async function api(action,options={}){const r=await fetch(API+'?action='+action,{...options,headers:{'Accept':'application/json','Content-Type':'application/json','Authorization':'Bearer '+token,...(options.headers||{})}});const j=await r.json().catch(()=>({ok:false,error:'استجابة غير صالحة'}));if(!r.ok||!j.ok)throw Error(j.error||'تعذر تنفيذ الطلب');return j}
function render(){if(!selected)return;document.documentElement.style.setProperty('--gold',selected.color_primary||'#f5c85b');$('price').textContent=fmt(selected.price_gold)+' ذهب';$('duration').textContent=selected.duration_days+' يومًا';$('crown').textContent=selected.slug==='king'?'♛':selected.slug==='emperor'?'♕':'✦';$('featureCount').textContent=selected.features.length+' امتيازات';$('features').innerHTML=selected.features.map((f,i)=>`<article class="feature" style="animation-delay:${i*35}ms"><i>${f.icon||'✦'}</i><b>${f.name_ar}</b><small>${f.description_ar||''}</small></article>`).join('');document.querySelectorAll('.level').forEach(x=>x.classList.toggle('active',x.dataset.id==selected.id));$('buy').disabled=!!(status&&status.level_id>=selected.id&&new Date(status.expires_at)>new Date());$('buy').textContent=$('buy').disabled?'مفعّلة حاليًا':'شراء وتفعيل'}
function renderLevels(){ $('levels').innerHTML=catalog.map(l=>`<button class="level" data-id="${l.id}"><span>${l.slug==='king'?'♛':l.slug==='emperor'?'♕':'✦'}</span><b>${l.name_ar}</b></button>`).join('');document.querySelectorAll('.level').forEach(x=>x.onclick=()=>{selected=catalog.find(l=>l.id==x.dataset.id);render()})}
async function load(){document.body.classList.add('loading');try{const j=await api('aristocracy_catalog');catalog=j.data.levels||[];status=j.data.status||null;const me=j.data.user||{};$('username').textContent=me.username?'@'+me.username:'مستخدم SAKI';$('balance').textContent=fmt(j.data.gold_coins)+' ذهب';if(me.avatar_url)$('avatar').src=me.avatar_url;selected=catalog.find(l=>l.id===status?.level_id)||catalog[0];renderLevels();render();$('status').textContent=status?'الرتبة الحالية: '+status.level_name+' · حتى '+new Date(status.expires_at).toLocaleDateString('ar'):'لا توجد عضوية فعالة'}catch(e){toast(e.message)}finally{document.body.classList.remove('loading')}}
$('buy').onclick=async()=>{if(!selected)return;const btn=$('buy');btn.disabled=true;try{const j=await api('aristocracy_purchase',{method:'POST',body:JSON.stringify({level_id:selected.id,request_id:crypto.randomUUID()})});status=j.data.status;$('balance').textContent=fmt(j.data.gold_coins)+' ذهب';$('status').textContent='تم التفعيل حتى '+new Date(status.expires_at).toLocaleDateString('ar');toast('تم شراء وتفعيل الاستقراطية بنجاح');render();if(window.SakiBridge){SakiBridge.postMessage('aristocracy_updated')}}catch(e){toast(e.message);btn.disabled=false}};load();
</script></body></html>
